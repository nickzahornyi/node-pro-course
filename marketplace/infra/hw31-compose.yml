name: nodejs-pro-hw31
services:
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:23166:4566"
    environment:
      ENFORCE_IAM: "1"
      DEBUG: "1"
      AWS_DEFAULT_REGION: eu-central-1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 40
