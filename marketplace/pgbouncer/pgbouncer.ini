[databases]
marketplace = host=db port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_file = /run/secrets/userlist.txt
admin_users = marketplace
pool_mode = transaction
default_pool_size = 5
max_client_conn = 200
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
