openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: Contract for products and orders in a small marketplace.
security: []
servers:
  - url: http://localhost:3000
paths:
  /products:
    get:
      operationId: listProducts
      summary: List products
      description: Returns products using cursor-based pagination.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProduct
      summary: Get a product
      description: Returns one product by its identifier.
      responses:
        '200':
          description: Product found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      description: Returns orders using cursor-based pagination.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createOrder
      summary: Create an order
      description: Creates a new order with one or more line items.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Reusing the same key with the same request body returns the same response; using it with a different body returns 422.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Order created, or the original response replayed.
          headers:
            Idempotency-Replay:
              description: True when a stored response is replayed.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      summary: Get an order
      description: Returns one order by its identifier.
      responses:
        '200':
          description: Order found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    patch:
      operationId: changeOrderStatus
      summary: Change an owned order status
      description: Updates status in a transaction and publishes order.status only after commit. Repeating the current status emits no event. This educational status setter does not perform payment or refund accounting.
      security:
        - RealtimeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Committed change (or unchanged status).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [order_id, previous_status, status, changed, event_id]
                properties:
                  order_id: { type: string }
                  previous_status:
                    $ref: '#/components/schemas/OrderStatus'
                  status:
                    $ref: '#/components/schemas/OrderStatus'
                  changed: { type: boolean }
                  event_id: { type: integer, minimum: 1, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /orders/{orderId}/events:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: streamOrderEvents
      summary: Subscribe to an owned order status stream
      description: SSE frames contain id, event order.status, and JSON data with the OrderStatusEvent shape. Last-Event-ID replays retained events strictly greater than the cursor. Without the header only future changes are sent. The last 500 events are retained per process; expired replay history returns 410 and a cursor ahead of history returns 400.
      security:
        - RealtimeBearer: []
      parameters:
        - name: Last-Event-ID
          in: header
          description: Last received event ID; replay is scoped to the authenticated order.
          schema:
            type: string
            pattern: '^\d+$'
      responses:
        '200':
          description: Continuous SSE text frames; JSON data follows OrderStatusEvent.
          content:
            text/event-stream:
              schema: { type: string }
              x-event-data-schema:
                $ref: '#/components/schemas/OrderStatusEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Replay history was evicted; read the current order and resubscribe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    RealtimeBearer:
      type: http
      scheme: bearer
      description: Operator-issued, expiring HMAC-signed identity token. For Socket.IO supply this same token in handshake.auth.token.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of records in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque token identifying where the next page starts; clients must not parse it.
      schema:
        type: string
        minLength: 1
    ProductId:
      name: productId
      in: path
      required: true
      description: Unique product identifier.
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      description: Unique order identifier.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, invalid or expired identity token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated user does not own the order.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Request does not satisfy the API contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The request is structurally valid but violates a domain rule, such as referencing an unknown product or reusing an idempotency key with another body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: An unexpected error occurred while processing the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OrderStatus:
      type: string
      enum: [pending, paid, shipped, cancelled]
    OrderStatusEvent:
      type: object
      additionalProperties: false
      required: [id, order_id, previous_status, status, occurred_at]
      properties:
        id: { type: integer, minimum: 1 }
        order_id: { type: string }
        previous_status:
          $ref: '#/components/schemas/OrderStatus'
        status:
          $ref: '#/components/schemas/OrderStatus'
        occurred_at: { type: string, format: date-time }
    Product:
      type: object
      additionalProperties: false
      required: [id, name, price_cents]
      properties:
        id: { type: string }
        name: { type: string }
        price_cents: { type: integer, minimum: 0 }
    OrderItemInput:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id: { type: string }
        quantity: { type: integer, minimum: 1 }
    OrderItem:
      type: object
      additionalProperties: false
      required: [product_id, quantity, unit_price_cents]
      properties:
        product_id: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price_cents: { type: integer, minimum: 0 }
    CreateOrder:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
    Order:
      type: object
      additionalProperties: false
      required: [id, status, items, total_cents]
      properties:
        id: { type: string }
        status: { type: string, enum: [created, paid, shipped, cancelled], description: Pending drafts retain the legacy public value created. Other statuses reflect the stored order status. }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents: { type: integer, minimum: 0 }
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or null when no pages remain.
    OrderPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or null when no pages remain.
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, format: uri, description: URI identifying the error type. }
        title: { type: string, description: Short human-readable error title. }
        status: { type: integer, minimum: 400, maximum: 599, description: HTTP status code. }
        detail: { type: string, description: Explanation specific to this occurrence. }
        instance: { type: string, description: Request path identifying this occurrence. }
