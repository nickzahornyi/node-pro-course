services:
  redis-cache:
    image: redis:8.2-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_CACHE_PUBLISHED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-queue:
    image: redis:8.2-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_QUEUE_PUBLISHED_PORT:-6380}:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-worker:
    image: ${COMPOSE_PROJECT_NAME:-marketplace}-redis-worker-ops
    pull_policy: build
    build:
      context: .
      target: ops
    environment:
      DB_URL: postgresql://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_QUEUE_URL: redis://redis-queue:6379
    volumes:
      - db_credentials:/run/secrets:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
    command: ["node", "dist/redis/worker-main.js"]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').existsSync('/tmp/redis-worker-ready') ? 0 : 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.2-management@sha256:9e9fd21d60f060acc9ecbd847cd1dcb87e6550bdb0297c27e79a40bfe1766ce4
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${BROKER_PUBLISHED_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PUBLISHED_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  rabbit-bootstrap:
    image: ${COMPOSE_PROJECT_NAME:-marketplace}-rabbit-bootstrap-ops
    pull_policy: build
    build:
      context: .
      target: ops
    environment:
      BROKER_URL: amqp://app:app@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["node", "dist/async/bootstrap.js"]

  order-consumer:
    image: ${COMPOSE_PROJECT_NAME:-marketplace}-order-consumer-ops
    pull_policy: build
    build:
      context: .
      target: ops
    environment:
      DB_URL: postgresql://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
      BROKER_URL: amqp://app:app@rabbitmq:5672
    volumes:
      - db_credentials:/run/secrets:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      rabbit-bootstrap:
        condition: service_completed_successfully
    command: ["node", "dist/async/consumer-main.js"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').existsSync('/tmp/order-consumer-ready') ? 0 : 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  outbox-relay:
    image: ${COMPOSE_PROJECT_NAME:-marketplace}-outbox-relay-ops
    pull_policy: build
    build:
      context: .
      target: ops
    environment:
      DB_URL: postgresql://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_QUEUE_URL: redis://redis-queue:6379
    volumes:
      - db_credentials:/run/secrets:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
    command: ["node", "dist/outbox/relay-main.js"]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').existsSync('/tmp/outbox-relay-ready') ? 0 : 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  pact-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact-local-only
      POSTGRES_DB: pact
    volumes:
      - pact_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pact -d pact"]
      interval: 2s
      timeout: 3s
      retries: 30

  pact-broker:
    image: pactfoundation/pact-broker@sha256:420341d4fbfb00a621c313f47e530ad75703f969bbc7520d0d72bc71bb53cef9
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: pact-db
      PACT_BROKER_DATABASE_NAME: pact
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: pact-local-only
    depends_on:
      pact-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PACT_BROKER_PUBLISHED_PORT:-9292}:9292"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
  credentials:
    image: postgres:17-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chmod 755 /runtime
        if [ ! -s /runtime/db_password ]; then
          cp /bootstrap/password /runtime/db_password
        fi
        if [ ! -s /runtime/userlist.txt ]; then
          printf '"marketplace" "%s"\n' "$$(cat /runtime/db_password)" > /runtime/userlist.txt
        fi
        if [ ! -s /runtime/realtime_auth_secret ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /runtime/realtime_auth_secret
        fi
        chmod 644 /runtime/realtime_auth_secret
        chmod 644 /runtime/db_password /runtime/userlist.txt
    volumes:
      - db_credentials:/runtime
    secrets:
      - source: db_bootstrap_password
        target: /bootstrap/password

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    depends_on:
      credentials:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_credentials:/run/secrets
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5432}:5432"

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    entrypoint: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - db_credentials:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGBOUNCER_PUBLISHED_PORT:-6432}:6432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$(cat /run/secrets/db_password) psql -h 127.0.0.1 -p 6432 -U marketplace -d marketplace -XAtc 'SELECT 1' | grep -qx 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  bootstrap:
    image: ${COMPOSE_PROJECT_NAME:-marketplace}-bootstrap-ops
    pull_policy: build
    build:
      context: .
      target: ops
    environment:
      DB_URL: postgresql://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_credentials:/run/secrets:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
    command: ["sh", "-ec", "node node_modules/typeorm/cli.js migration:run -d dist/data-source.js && node dist/seed.js"]

  ops:
    profiles: [tools]
    image: ${COMPOSE_PROJECT_NAME:-marketplace}-ops
    pull_policy: never
    build:
      context: .
      target: ops
    environment:
      LOCAL_PGBOUNCER_PORT: ${PGBOUNCER_PUBLISHED_PORT:-6432}
      LOCAL_POSTGRES_PORT: ${DB_PUBLISHED_PORT:-5432}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_KID: ${JWT_KID}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      JWT_PREVIOUS_PUBLIC_KEYS: ${JWT_PREVIOUS_PUBLIC_KEYS:-}
      DB_URL: postgresql://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_POOL_MAX: 10
      AUTH_SECRET_FILE: /run/secrets/realtime_auth_secret
      BROKER_URL: amqp://app:app@rabbitmq:5672
      REDIS_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
    volumes:
      - db_credentials:/run/secrets:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PUBLISHED_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/db-health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

secrets:
  db_bootstrap_password:
    file: ./db/db_password.example

volumes:
  redis_queue_data:
  rabbitmq_data:
  pact_data:
  postgres_data:
  db_credentials:
