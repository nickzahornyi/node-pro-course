services:
  pact-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact-local-only
      POSTGRES_DB: pact
    volumes:
      - pact_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pact -d pact"]
      interval: 2s
      timeout: 3s
      retries: 30

  pact-broker:
    image: pactfoundation/pact-broker@sha256:420341d4fbfb00a621c313f47e530ad75703f969bbc7520d0d72bc71bb53cef9
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: pact-db
      PACT_BROKER_DATABASE_NAME: pact
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: pact-local-only
    depends_on:
      pact-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PACT_BROKER_PUBLISHED_PORT:-9292}:9292"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
  credentials:
    image: postgres:17-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chmod 755 /runtime
        if [ ! -s /runtime/db_password ]; then
          cp /bootstrap/password /runtime/db_password
        fi
        if [ ! -s /runtime/userlist.txt ]; then
          printf '"marketplace" "%s"\n' "$$(cat /runtime/db_password)" > /runtime/userlist.txt
        fi
        chmod 644 /runtime/db_password /runtime/userlist.txt
    volumes:
      - db_credentials:/runtime
    secrets:
      - source: db_bootstrap_password
        target: /bootstrap/password

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    depends_on:
      credentials:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_credentials:/run/secrets
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5432}:5432"

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    entrypoint: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - db_credentials:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGBOUNCER_PUBLISHED_PORT:-6432}:6432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$(cat /run/secrets/db_password) psql -h 127.0.0.1 -p 6432 -U marketplace -d marketplace -XAtc 'SELECT 1' | grep -qx 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  bootstrap:
    image: ${COMPOSE_PROJECT_NAME:-marketplace}-ops
    pull_policy: build
    build:
      context: .
      target: ops
    environment:
      DB_URL: postgresql://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_credentials:/run/secrets:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
    command: ["sh", "-ec", "node node_modules/typeorm/cli.js migration:run -d dist/data-source.js && node dist/seed.js"]

  ops:
    profiles: [tools]
    image: ${COMPOSE_PROJECT_NAME:-marketplace}-ops
    pull_policy: never
    build:
      context: .
      target: ops
    environment:
      LOCAL_PGBOUNCER_PORT: ${PGBOUNCER_PUBLISHED_PORT:-6432}
      LOCAL_POSTGRES_PORT: ${DB_PUBLISHED_PORT:-5432}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_URL: postgresql://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_POOL_MAX: 10
    volumes:
      - db_credentials:/run/secrets:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PUBLISHED_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/db-health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

secrets:
  db_bootstrap_password:
    file: ./db/db_password.example

volumes:
  pact_data:
  postgres_data:
  db_credentials:
