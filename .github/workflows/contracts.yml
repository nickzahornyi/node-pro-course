name: Marketplace tests and contracts
on:
  pull_request:
  push:
    branches: [main, hw-16, hw-18, hw-19, hw-22, hw-23, hw-24, hw-26]
permissions:
  contents: read
defaults:
  run:
    working-directory: marketplace
jobs:
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: marketplace-files-ci
      SKIP_VAULT: '1'
      DB_URL: postgresql://marketplace@127.0.0.1:6432/marketplace
      DB_PASSWORD: marketplace-local-password
      STORAGE_ENDPOINT: http://127.0.0.1:22650
      STORAGE_ACCESS_KEY: hw26user
      STORAGE_SECRET_KEY: hw26secretpass
      STORAGE_BUCKET: hw26-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: node scripts/ci-auth.mjs
      - run: npx tsc --noEmit
      - run: docker compose up -d --wait storage pgbouncer
      - name: Files acceptance with multipart recovery twice
        run: |
          npm run demo:upload
          npm run demo:multipart
          npm run demo:multipart
          npm run demo:cdn
      - if: always()
        run: docker compose down --volumes
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: marketplace-auth-ci
      SKIP_VAULT: '1'
      DB_URL: postgresql://marketplace@127.0.0.1:6432/marketplace
      DB_PASSWORD: marketplace-local-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: node scripts/ci-auth.mjs
      - run: npx tsc --noEmit
      - run: docker compose up -d --wait pgbouncer
      - name: Auth acceptance twice
        run: |
          for round in 1 2; do
            npm run demo:auth
            npm run demo:reuse
            npm run demo:rbac
          done
      - if: always()
        run: docker compose down --volumes
  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: marketplace-redis-ci
      SKIP_VAULT: '1'
      DB_URL: postgresql://marketplace@127.0.0.1:6432/marketplace
      DB_PASSWORD: marketplace-local-password
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_QUEUE_URL: redis://127.0.0.1:6380
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/ci-auth.mjs
      - run: docker compose up -d --wait app outbox-relay redis-worker
      - run: npm run build && npm run migrate
      - name: Redis acceptance twice without manual cleanup
        run: |
          for round in 1 2; do
            npm run demo:cache
            npm run demo:session
            npm run demo:ratelimit
            npm run demo:queue
          done
      - run: npm run test:redis
      - name: Collect Redis diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=100
      - name: Stop isolated Redis deployment
        if: always()
        run: docker compose down --volumes
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:integration && npm run test:integration
      - run: npm run test:e2e
  async:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: marketplace-async-ci
      SKIP_VAULT: '1'
      DB_URL: postgresql://marketplace@127.0.0.1:6432/marketplace
      DB_PASSWORD: marketplace-local-password
      BROKER_URL: amqp://app:app@127.0.0.1:5672
      ASYNC_API_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: node scripts/ci-auth.mjs
      - run: docker compose up -d --wait app order-consumer outbox-relay redis-worker
      - name: Run all async demos twice without manual cleanup
        run: |
          for round in 1 2; do
            npm run demo:publish
            npm run demo:dlq
            npm run demo:duplicate
            npm run demo:outbox
            npm run demo:crash-write
            npm run demo:crash-relay
          done
      - run: npm run test:async
      - name: Collect async service diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=150
      - name: Stop isolated async deployment
        if: always()
        run: docker compose down --volumes
  contract:
    runs-on: ubuntu-latest
    services:
      pact-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pact
          POSTGRES_PASSWORD: pact-local-only
          POSTGRES_DB: pact
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pact -d pact"
          --health-interval 2s --health-timeout 3s --health-retries 30
      pact-broker:
        image: pactfoundation/pact-broker@sha256:420341d4fbfb00a621c313f47e530ad75703f969bbc7520d0d72bc71bb53cef9
        env:
          PACT_BROKER_DATABASE_ADAPTER: postgres
          PACT_BROKER_DATABASE_HOST: pact-db
          PACT_BROKER_DATABASE_NAME: pact
          PACT_BROKER_DATABASE_USERNAME: pact
          PACT_BROKER_DATABASE_PASSWORD: pact-local-only
        ports:
          - 9292:9292
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat"
          --health-interval 3s --health-timeout 5s --health-retries 40
          --health-start-period 10s
    env:
      PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL || 'http://127.0.0.1:9292' }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      LOCAL_BROKER: ${{ secrets.PACT_BROKER_URL == '' }}
      SKIP_VAULT: '1'
      COMPOSE_PROJECT_NAME: marketplace-contract-ci
      CONSUMER_VERSION: ${{ github.sha }}
      PROVIDER_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: npm run test:contract
      - name: Publish consumer contract
        run: npm run pact:publish
      - name: Verify real provider and publish verification result
        run: bash scripts/with-secrets.sh dev npm run verify:provider
      - name: Fresh local broker rejects deployment without prod version
        if: env.LOCAL_BROKER == 'true'
        run: |
          curl --fail-with-body --silent --show-error \
            "$PACT_BROKER_URL/can-i-deploy?pacticipant=MarketplaceWeb&version=$CONSUMER_VERSION&to=prod" \
            | node --input-type=module -e 'let body=""; for await (const chunk of process.stdin) body+=chunk; const {summary}=JSON.parse(body); console.log(summary); if(summary.deployable!==null || summary.unknown!==1) process.exit(1);'
          if npm run pact:can-i-deploy; then
            echo 'Expected unknown gate before the first deployment' >&2
            exit 1
          fi
      - name: Deploy provider to isolated CI environment
        if: env.LOCAL_BROKER == 'true'
        run: |
          docker compose up -d --build --wait app
          curl --fail-with-body http://127.0.0.1:3000/db-health
          curl --fail-with-body http://127.0.0.1:3000/products/7
      - name: Record deployed provider version in isolated broker
        if: env.LOCAL_BROKER == 'true'
        run: npm run pact:tag-prod
      - name: can-i-deploy (only deployable true passes)
        run: npm run pact:can-i-deploy
      - name: Stop isolated deployment
        if: always() && env.LOCAL_BROKER == 'true'
        run: docker compose down --volumes
